report_comment: >
  This report has been generated by the <a href="https://github.com/UKWgenommedizin/FA-NIVA" target="_blank">FA-NIVA</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/UKWgenommedizin/FA-NIVA" target="_blank">documentation</a>.

# Style the Samtools flagstat read counts in General Statistics.
general_stats_columns:
  samtools:
    columns:
      flagstat_total:
        title: "M Reads"
        description: "Total reads in the BAM"
        hidden: false
        min: 0
        scale: "GnBu"
      mapped_passed:
        title: "M Reads Mapped"
        description: "QC-passed reads mapped by samtools flagstat"
        hidden: false
        min: 0
        scale: "YlGn"
      mapped_passed_pct:
        title: "% Reads Mapped"
        description: "Percentage of QC-passed reads mapped by samtools flagstat"
        hidden: false
        min: 0
        max: 100
        scale: "RdYlGn"
        format: "{:,.1f}%"

report_section_order:
  "FA-NIVA-summary":
    order: 1000
  "FA-NIVA-methods-description":
    order: 1001
  software_versions:
    order: 1002
  "pycoqc":
    order: 100
  "mosdepth":
    order: 90

export_plots: true
