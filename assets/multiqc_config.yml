report_comment: >
  This report has been generated by the <a href="https://github.com/UKWgenommedizin/FA-NIVA" target="_blank">FA-NIVA</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/UKWgenommedizin/FA-NIVA" target="_blank">documentation</a>.

report_section_order:
  pacbio_bam_summary:
    after: Samtools
  samtools_flagstat_color_table:
    after: pacbio_bam_summary
  "pycoqc":
    after: samtools_flagstat_color_table
  "mosdepth":
    after: pycoqc
  "UKWgenommedizin-FA-NIVA-summary":
    after: mosdepth
  "FA-NIVA-methods-description":
    after: UKWgenommedizin-FA-NIVA-summary
  software_versions:
    after: FA-NIVA-methods-description

export_plots: true

# Replace the native Samtools Flagstat beeswarm with the color-scaled table.
remove_sections:
  - samtools-flagstat

# Use the styled custom columns instead of the native unstyled counts.
table_columns_visible:
  Samtools:
    flagstat_total: false
    mapped_passed: false
