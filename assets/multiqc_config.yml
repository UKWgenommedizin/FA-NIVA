  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/UKWgenommedizin/FA-NIVA" target="_blank">documentation</a>.

report_section_order:
  "UKWgenommedizin-FA-NIVA-summary":
    order: 3
  "FA-NIVA-methods-description":
    order: 2
  software_versions:
    order: 1
  "pycoqc":
    order: 100
  "mosdepth":
    order: 90

export_plots: true

# Replace the native Samtools Flagstat beeswarm with the color-scaled table.
remove_sections:
  - samtools-flagstat

# Use the styled custom columns instead of the native unstyled counts.
table_columns_visible:
  Samtools:
    flagstat_total: false
    mapped_passed: false
